<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Newsletter Flipbook</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div id="book">

        <!-- Front Cover -->
        <div class="page" data-density="hard">
            <img src="pages/page1.png" alt="Page 1">
        </div>

        <!-- Inside Pages -->
        <div class="page">
            <img src="pages/page2.png" alt="Page 2">
        </div>

        <div class="page">
            <img src="pages/page3.png" alt="Page 3">
        </div>

        <div class="page">
            <img src="pages/page4.png" alt="Page 4">
        </div>

        <div class="page">
            <img src="pages/page5.png" alt="Page 5">
        </div>

        <!-- Back Cover -->
        <div class="page" data-density="hard">
            <img src="pages/page6.png" alt="Page 6">
        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/page-flip/dist/js/page-flip.browser.js"></script>
    <script src="script.js"></script>

</body>

</html>
