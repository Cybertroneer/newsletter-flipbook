<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Newsletter Flipbook</title>

    <link rel="stylesheet" href="style.css">
</head>


<body>

    <div id="book">

        <!-- PAGE 1 -->
        <div class="page" data-density="hard">
            <img
                src="pages/page1.png"
                alt="Newsletter Page 1"
            >
        </div>


        <!-- PAGE 2 -->
        <div class="page">
            <img
                src="pages/page2.png"
                alt="Newsletter Page 2"
            >
        </div>


        <!-- PAGE 3 -->
        <div class="page">
            <img
                src="pages/page3.png"
                alt="Newsletter Page 3"
            >
        </div>


        <!-- PAGE 4 -->
        <div class="page">
            <img
                src="pages/page4.png"
                alt="Newsletter Page 4"
            >
        </div>


        <!-- PAGE 5 -->
        <div class="page">
            <img
                src="pages/page5.png"
                alt="Newsletter Page 5"
            >
        </div>


        <!-- PAGE 6 -->
        <div class="page" data-density="hard">
            <img
                src="pages/page6.png"
                alt="Newsletter Page 6"
            >
        </div>

    </div>


    <!-- StPageFlip -->
    <script src="https://cdn.jsdelivr.net/npm/page-flip/dist/js/page-flip.browser.js"></script>

    <!-- Our custom script -->
    <script src="script.js"></script>

</body>

</html>
